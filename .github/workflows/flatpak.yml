# Builds WebPlus.flatpak on every push, and attaches it to a release when you publish one.
name: Flatpak
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  flatpak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Flatpak tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Build
        run: |
          flatpak-builder --user --force-clean --disable-rofiles-fuse --install-deps-from=flathub \
            --repo=repo build-dir packaging/flatpak/live.fourthepeople.WebPlus.yml
          flatpak build-bundle repo WebPlus.flatpak live.fourthepeople.WebPlus
      - uses: actions/upload-artifact@v4
        with:
          name: WebPlus.flatpak
          path: WebPlus.flatpak
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" WebPlus.flatpak --clobber
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3-pyqt5 python3-pil php-cli poppler-utils mupdf-tools
      - run: bash tests/run_all.sh
